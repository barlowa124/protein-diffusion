[project]
name = "protein-diffusion"
version = "0.1.0"
description = "DDPM over a real protein fitness landscape with oracle-evaluated generation"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "torch",
    "pyyaml",
    "snakemake",
    "pulp<3",  # snakemake 7.x calls pulp.list_solvers (removed in pulp 3.x)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
